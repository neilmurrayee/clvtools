[project]
name = "clvtools"
version = "0.1.0"
description = "A from-scratch, test-driven Python implementation of the CLVTools R package of Meierer et al."
readme = "README.md"
authors = [
    { name = "neilmurrayee", email = "132654876+neilmurrayee@users.noreply.github.com" }
]
requires-python = ">=3.12"
# GPL-3.0-only, matching CLVTools 0.12.1. The code here is written from scratch
# against the paper rather than translated from that package -- R never enters
# `src/`, and the oracle runs out-of-process -- but `src/clvtools/data/`
# redistributes the five datasets CLVTools bundles, exported to CSV by
# `tools/extract_data.R` and shipped inside the wheel.
# Matching the upstream licence is what makes that redistribution unambiguous.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "customer-lifetime-value", "clv", "pareto-nbd", "bg-nbd", "ggom-nbd",
    "gamma-gamma", "buy-till-you-die", "marketing-analytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# Everything `src/` imports, and nothing else. The R package CLVTools serves as
# the oracle for the test suite but is invoked out-of-process by the fixture
# generators in `tools/oracle/`; nothing in `src/` depends on it.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/neilmurrayee/clvtools"
Documentation = "https://github.com/neilmurrayee/clvtools/blob/main/docs/paper.md"
Changelog = "https://github.com/neilmurrayee/clvtools/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Only so the optional render() path is exercised; src/ never imports it.
    "matplotlib>=3.9",
    # Static analysis, run as a test by tests/test_code_quality.py.
    "ruff>=0.16.5",
    # Informational only -- the maintainability and complexity reports in
    # CLAUDE.md's commands. Nothing gates on it.
    "radon>=6.0.1",
    # The type checker, run as a test by tests/test_code_quality.py. Pinned
    # exactly rather than with `>=`: ty is pre-1.0 and its inference changes
    # between releases, so a floating version would turn an upgrade into a
    # surprise failure in an unrelated change. Bump it deliberately.
    "ty==0.0.77",
    "nbmake>=1.5.5",
]

[project.optional-dependencies]
# For clvtools.diagnostics.render(). The frames the diagnostics return are
# useful without it, so it stays out of the core.
plot = ["matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "docs", "examples"]
# `-m 'not dyncov_fit'` used to live here, and a user's own `-m` replaced it:
# `pytest -m "not slow"` then collected the ten-minute time-varying fit, which
# is the slowest test in the repo and the one thing "not slow" clearly excludes.
# The deselection moved to `tests/conftest.py`, where it composes with whatever
# the caller asks for instead of being overwritten by it. See finding 15 of
# the 2026-09 review.
addopts = "-q --strict-markers --doctest-modules --doctest-glob=*.md --nbmake"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
  "paper: reproduces a number printed in Meierer et al. (JSS 5634)",
  "rdoc: reproduces a number printed in the R package's own documentation",
  "literature: reproduces a number published in the CLV literature (Fader/Hardie et al.)",
  "oracle: checked against a fixture generated by the R package CLVTools",
  "slow: full-dataset MLE fits",
  "dyncov_fit: the time-varying covariate MLE; minutes, not seconds",
  "quality: static analysis -- lint, complexity and size limits",
  "performance: operation-count invariants -- vectorisation, evaluations, O(n)",
]

# ---------------------------------------------------------------------------
# Static analysis. The thresholds below are not defaults picked off a shelf;
# each was chosen after measuring this codebase, so that it sits just under the
# gate and any regression trips it. See `tests/test_code_quality.py`, which runs
# these tools as part of the ordinary `pytest` run.
# ---------------------------------------------------------------------------
[tool.ruff]
# Measured: the code sits naturally at <=92. Set here rather than at black's 88
# so the rule catches genuinely runaway lines instead of flagging ordinary ones.
line-length = 92
target-version = "py312"
extend-exclude = ["arXiv-2602.09845v1"]

[tool.ruff.lint]
select = [
  "F", "E", "W",       # pyflakes + pycodestyle
  "I",                 # import order
  "UP",                # pyupgrade
  "B",                 # bugbear: real bugs
  "C4", "C901",        # comprehensions; cyclomatic complexity
  "PL",                # pylint's own checks, incl. the design limits below
  "RUF", "SIM", "RET", "PIE", "FURB",
  "ARG",               # unused arguments
  "PT",                # pytest style
  "PD",                # pandas
  "NPY",               # numpy
  "T20",               # stray print()
  "TRY", "EM", "RSE",  # exception hygiene
  "A", "ISC", "ICN", "INP", "PYI", "Q", "SLOT", "TID", "YTT", "EXE",
  "N",                 # naming
  "S",                 # bandit
  "ERA",               # commented-out code
]
ignore = [
  # The paper's notation is the point. `N`, `T_cal`, `Px`, `A1sum` and friends
  # are named for the equations they implement; renaming them to snake_case
  # would break the mapping the docstrings assert.
  "N803", "N806",
  # Numerical code compares against literal constants constantly.
  "PLR2004",
  # Deliberate: matplotlib stays out of module scope (see CLAUDE.md), and some
  # imports are local to break cycles.
  "PLC0415",
  # Message-in-exception style. High volume, no defect-finding power.
  "TRY003", "EM101", "EM102",
  # Formatter conflicts.
  "ISC001", "Q000", "Q001", "Q002", "Q003", "W191", "E111", "E117",
  # `.unstack()` reshapes without aggregating; `.pivot_table()` is not a
  # drop-in replacement for it.
  "PD010",
]

# The limits the gate enforces, each set from what the code actually needs.
# Worst across `src/`, `tests/`, `tools/` and `docs/` as measured: mccabe 8,
# 42 statements, 8 branches, 5 returns. Prefer splitting a function to raising
# one of these.
#
# mccabe read 10 against a limit of 10 until the complexity pass that took
# `latent_attrition`, `predict`, `fit_gg`, `ClvData.__init__` and
# `fit_static_covariates` apart. A gate with no headroom stops guiding and
# starts obstructing -- the next branch anyone added would have tripped it --
# so re-measure this line when a split lands, and lower a limit that has
# drifted far above the code rather than leaving it decorative.
#
# `max-locals` is deliberately absent: PLR0914 is preview-only in ruff 0.16, so
# setting it would read like a gate while never firing.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-returns = 6
# The likelihoods take the paper's own signature -- data, model parameters,
# both gamma vectors, both design matrices -- which runs to twelve. The two
# functions that exceed it say why at the site.
max-args = 12
max-positional-args = 12

[tool.ruff.lint.per-file-ignores]
# A fixture is often requested for the state it sets up, not for its value,
# so an unused fixture argument in a test is intent, not an oversight.
"tests/**" = [
  "S101", "PLR0913", "PLR0917", "ARG001", "ARG002", "ARG005", "INP001", "ERA001",
]
"tools/**" = ["S101", "T201", "INP001", "PLR0913", "PLR0917"]
"docs/**" = ["INP001"]
"src/clvtools/**" = ["S101"]  # asserts guard oracle conventions, not user input

[tool.ruff.lint.isort]
known-first-party = ["clvtools"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"   # the style already used throughout tests/

# ---------------------------------------------------------------------------
# Type checking. `src/clvtools/py.typed` tells downstream checkers that the
# annotations here are meant to be relied on, so something has to check them;
# `tests/test_code_quality.py` runs this over `src/` in the same breath as
# ruff. Only `src/` -- that is the surface `py.typed` makes a promise about.
# ---------------------------------------------------------------------------
[tool.ty.rules]
# Three rules are off, and all three for the same reason: pandas' and numpy's
# own stubs are wider than the values this code actually handles, and the
# residue is theirs rather than ours. The count in each note is what was left
# after the real defects were fixed -- if one of these grows, the note is
# wrong and the rule should come back on rather than the number go up.
#
# `Timestamp + Timedelta` and `pd.Timestamp(year=..., month=..., day=...)` are
# both typed `Timestamp | NaTType`, because NaT propagates through Timestamp
# arithmetic. Nothing here ever holds a NaT: the dates come from a transaction
# log that `ClvData` has already validated. 12 sites, in `timeunit`, `data`
# and `predict`.
invalid-return-type = "ignore"
# The same `Timestamp | NaTType` passed on to a callee (8 sites), plus
# `float(Series.mean())`, which the stubs type `Series | Any` because `mean()`
# takes an `axis` (2 sites). 10 in all.
invalid-argument-type = "ignore"
# `DataFrame.groupby(...)` keys are typed `Hashable`, so writing one into a
# `dict[str, float]` is rejected even though `Id` is a string everywhere (see
# CLAUDE.md), and one more `Timestamp | NaTType`. 3 sites.
invalid-assignment = "ignore"
