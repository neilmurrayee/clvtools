[project]
name = "clvtools"
version = "0.1.0"
description = "A from-scratch, test-driven Python implementation of the CLVTools R package of Meierer et al."
readme = "README.md"
authors = [
    { name = "neilmurrayee", email = "132654876+neilmurrayee@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Everything `src/` imports, and nothing else. The R package CLVTools serves as
# the oracle for the test suite but is invoked out-of-process by the fixture
# generators in `tools/oracle/`; nothing in `src/` depends on it.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Only so the optional render() path is exercised; src/ never imports it.
    "matplotlib>=3.9",
    # Static analysis, run as a test by tests/test_code_quality.py.
    "ruff>=0.16.5",
    # Informational only -- the maintainability and complexity reports in
    # CLAUDE.md's commands. Nothing gates on it.
    "radon>=6.0.1",
]

[project.optional-dependencies]
# For clvtools.diagnostics.render(). The frames the diagnostics return are
# useful without it, so it stays out of the core.
plot = ["matplotlib>=3.9"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "docs"]
addopts = "-q --strict-markers --doctest-modules --doctest-glob=*.md -m 'not dyncov_fit'"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
  "paper: reproduces a number printed in Meierer et al. (JSS 5634)",
  "rdoc: reproduces a number printed in the R package's own documentation",
  "oracle: checked against a fixture generated by the R package CLVTools",
  "slow: full-dataset MLE fits",
  "dyncov_fit: the time-varying covariate MLE; minutes, not seconds",
  "quality: static analysis -- lint, complexity and size limits",
]

# ---------------------------------------------------------------------------
# Static analysis. The thresholds below are not defaults picked off a shelf;
# each was chosen after measuring this codebase, so that it sits just under the
# gate and any regression trips it. See `tests/test_code_quality.py`, which runs
# these tools as part of the ordinary `pytest` run.
# ---------------------------------------------------------------------------
[tool.ruff]
# Measured: the code sits naturally at <=92. Set here rather than at black's 88
# so the rule catches genuinely runaway lines instead of flagging ordinary ones.
line-length = 92
target-version = "py312"
extend-exclude = ["arXiv-2602.09845v1"]

[tool.ruff.lint]
select = [
  "F", "E", "W",       # pyflakes + pycodestyle
  "I",                 # import order
  "UP",                # pyupgrade
  "B",                 # bugbear: real bugs
  "C4", "C901",        # comprehensions; cyclomatic complexity
  "PL",                # pylint's own checks, incl. the design limits below
  "RUF", "SIM", "RET", "PIE", "FURB",
  "ARG",               # unused arguments
  "PT",                # pytest style
  "PD",                # pandas
  "NPY",               # numpy
  "T20",               # stray print()
  "TRY", "EM", "RSE",  # exception hygiene
  "A", "ISC", "ICN", "INP", "PYI", "Q", "SLOT", "TID", "YTT", "EXE",
  "N",                 # naming
  "S",                 # bandit
  "ERA",               # commented-out code
]
ignore = [
  # The paper's notation is the point. `N`, `T_cal`, `Px`, `A1sum` and friends
  # are named for the equations they implement; renaming them to snake_case
  # would break the mapping the docstrings assert.
  "N803", "N806",
  # Numerical code compares against literal constants constantly.
  "PLR2004",
  # Deliberate: matplotlib stays out of module scope (see CLAUDE.md), and some
  # imports are local to break cycles.
  "PLC0415",
  # Message-in-exception style. High volume, no defect-finding power.
  "TRY003", "EM101", "EM102",
  # Formatter conflicts.
  "ISC001", "Q000", "Q001", "Q002", "Q003", "W191", "E111", "E117",
  # `.unstack()` reshapes without aggregating; `.pivot_table()` is not a
  # drop-in replacement for it.
  "PD010",
]

# The limits the gate enforces, each set from what the code actually needs.
# Worst across `src/`, `tests/`, `tools/` and `docs/` at the time of writing:
# mccabe 10, 42 statements, 9 branches, 4 returns. Prefer splitting a function
# to raising one of these.
#
# `max-locals` is deliberately absent: PLR0914 is preview-only in ruff 0.16, so
# setting it would read like a gate while never firing.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-returns = 6
# The likelihoods take the paper's own signature -- data, model parameters,
# both gamma vectors, both design matrices -- which runs to twelve. The two
# functions that exceed it say why at the site.
max-args = 12
max-positional-args = 12

[tool.ruff.lint.per-file-ignores]
# A fixture is often requested for the state it sets up, not for its value,
# so an unused fixture argument in a test is intent, not an oversight.
"tests/**" = [
  "S101", "PLR0913", "PLR0917", "ARG001", "ARG002", "ARG005", "INP001", "ERA001",
]
"tools/**" = ["S101", "T201", "INP001", "PLR0913", "PLR0917"]
"docs/**" = ["INP001"]
"src/clvtools/**" = ["S101"]  # asserts guard oracle conventions, not user input

[tool.ruff.lint.isort]
known-first-party = ["clvtools"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"   # the style already used throughout tests/
